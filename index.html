        function removeVietnameseTones(str) {
            if (!str) return '';
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            str = str.replace(/[^a-zA-Z0-9]/g, "");
            return str.toLowerCase();
        }

            { id: 3, xa: 'Phường Sa Pa', biThu: 'Hoàng Văn E', ngayTiep: '2026-08-10', congDan: 'Ngo Văn F', diaChiCongDan: 'Tổ 2, Phường Sa Pa', noiDung: 'Đơn tố cáo vi phạm trật tự đô thị, lấn chiếm lòng đường', loai: 'Tố cáo', loaiHinhTiep: 'Đơn', soNguoi: 1, fileDinhKem: null, hanXuLy: '2026-09-08', trangThai: 'QuaHan', donViGiaiQuet: 'Ủย์ ban Kiểm tra Phường', fileGiaiQuet: null, nguonDon: 'Cơ quan khác chuyển đến', buocXuLy: 2, tienDo: 20, soVanBan: '12/UBKT', fileSoVanBan: null, ngayKetLuan: '' },

            const [lichTiepMap, setLichTiepMap] = useState(() => loadLocal(STORAGE_KEYS.lichTiep, INITIAL_LICH_TIEP));

            const [currentUser, setCurrentUser] = useState(() => loadLocal(STORAGE_KEYS.session, null));
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState('');

            const [dsVanBanDonDoc, setDsVanBanDonDoc] = useState(() => loadLocal(STORAGE_KEYS.vanBanDonDoc, []));
            const [editingAccount, setEditingAccount] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');

            const [selectedNguonDonFilter, setSelectedNguonDonFilter] = useState('ALL');
            const [filterLichTiepCK, setFilterLichTiepCK] = useState('ALL');

            const [newAccForm, setNewAccForm] = useState({

            const [showChangePassModal, setShowChangePassModal] = useState(false);
            const [passForm, setPassForm] = useState({ oldPass: '', newPass: '', confirmPass: '' });
            const [passMsg, setPassMsg] = useState({ type: '', text: '' });

            const [editingId, setEditingId] = useState(null);
            const [showProcessModal, setShowProcessModal] = useState(false);
            const [selectedItemForProcess, setSelectedItemForProcess] = useState(null);
            const [processForm, setProcessForm] = useState({

            });

            const [showDonDocModal, setShowDonDocModal] = useState(false);
            const [formDonDoc, setFormDonDoc] = useState({

                trichYeu: 'V/v đôn đốc giải quyết các vụ việc, đơn thư quá thời hạn quy định',
                hanBaoCao: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                yCau: 'Yêu cầu Thường trực Đảng ủy các xã, phường chỉ đạo các đơn vị thụ lý khẩn trương kiểm tra, giải quyết dứt điểm các vụ việc đôn đốc nêu trên và gửi báo cáo kết quả về Ban Nội chính Tỉnh ủy.'
            });
            // State mới: Danh sách các xã được chọn trong modal đôn đốc (hỗ trợ bỏ chọn các xã đã từng gửi đôn đốc trước đó)
            const [selectedXaDonDoc, setSelectedXaDonDoc] = useState([]);

            const [subTabNhapLieu, setSubTabNhapLieu] = useState('tiepdan');

            const [formLichTiepBiThu, setFormLichTiepBiThu] = useState({
                soNgayQuyDinh: 2,

                diaDiem: '',
                daCongKhai: true,
                fileThongBao: null,
                ghiChu: ''
            });

            useEffect(() => { saveLocal(STORAGE_KEYS.users, usersList); }, [usersList]);
            useEffect(() => { saveLocal(STORAGE_KEYS.data, dsPhanAnh); }, [dsPhanAnh]);
            useEffect(() => { saveLocal(STORAGE_KEYS.lichTiep, lichTiepMap); }, [lichTiepMap]);
            useEffect(() => { saveLocal(STORAGE_KEYS.vanBanDonDoc, dsVanBanDonDoc); }, [dsVanBanDonDoc]);
            useEffect(() => { if (currentUser) saveLocal(STORAGE_KEYS.session, currentUser); else localStorage.removeItem(STORAGE_KEYS.session); }, [currentUser]);

            useEffect(() => {
                if (currentUser && isUnitAccount(currentUser) && currentUser.xaName) {
                    const xaInfo = lichTiepMap[currentUser.xaName] || {
                        soNgayQuyDinh: 2,
                        ngayTiepDinhKy: 'Ngày 05 và ngày 20 hằng tháng',

                        daCongKhai: true,
                        fileThongBao: null,

                    };
                    setFormLichTiepBiThu(xaInfo);
                }
            }, [currentUser, lichTiepMap]);

            const [formTiepDan, setFormTiepDan] = useState({
                xa: 'Tỉnh ủy Lào Cai (Bí thư Tỉnh ủy)',

                ngayTiep: new Date().toISOString().split('T')[0],
                congDan: '',
                diaChiCongDan: '',
                loaiHinhTiep: 'Định kỳ',
                soNguoi: 1,

                xa: 'Tỉnh ủy Lào Cai (Bí thư Tỉnh ủy)',

                hanXuLy: new Date().toISOString().split('T')[0],
                congDan: '',
                diaChiCongDan: '',
                loai: 'Khiếu nại',
                linhVuc: '',
                noiDung: '',
                donViGiaiQuet: '',
                fileGiaiQuet: null,

                biThu: 'Cán bộ Bộ phận Một cửa / Tiếp nhận Đơn'
            });

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError('');
                const u = removeVietnameseTones(loginForm.username.trim());
                const p = loginForm.password;
                const foundUser = usersList.find(usr => usr.username === u);

                if (foundUser) {
                    if (foundUser.pass === p) {
                        setCurrentUser(foundUser);
                        if (isUnitAccount(foundUser)) {
                            setFormTiepDan(prev => ({ ...prev, xa: foundUser.xaName }));
                            setFormDonThu(prev => ({ ...prev, xa: foundUser.xaName }));
                            setActiveTab('danhsach');
                        } else {
                            setActiveTab('dashboard');
                        }
                        return;
                    } else {
                        setLoginError('Mật khẩu không chính xác!');
                        return;
                    }
                }
                setLoginError('Tên tài khoản không tồn tại trên hệ thống!');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                sessionStorage.removeItem(STORAGE_KEYS.session);
                setLoginForm({ username: '', password: '' });
                setLoginError('');
            };

            const handleCreateAccount = (e) => {
                e.preventDefault();
                const newU = removeVietnameseTones(newAccForm.username.trim());
                const nameDisplay = newAccForm.fullName.trim() || newAccForm.username;

                if (!newU) return;
                if (usersList.some(u => u.username === newU)) {
                    alert('Tên tài khoản này đã tồn tại!');
                    return;
                }

                let assignedXa = ['CAP_XA', 'CAP_DON_VI'].includes(newAccForm.role) ? newAccForm.xaName : null;
                const newUserObj = {
                    username: newU,
                    pass: (newAccForm.password || DEFAULT_UNIT_PASSWORD).trim(),
                    role: newAccForm.role,
                    name: nameDisplay,
                    xaName: assignedXa
                };

                setUsersList(prev => [...prev, newUserObj]);
                setNewAccForm({ username: '', fullName: '', password: '', role: 'CAP_XA', xaName: danhSachXa[0] });
                alert(`Khởi tạo thành công tài khoản "${newU}"!`);
            };

            const handleEditAccount = (usr) => {
                if (usr.username === 'admin') { alert('Không chỉnh sửa tài khoản Admin gốc tại màn hình này.'); return; }
                setEditingAccount({ ...usr });
            };

            const handleSaveAccount = (e) => {
                e.preventDefault();
                if (!editingAccount) return;
                const updated = { ...editingAccount, xaName: ['CAP_XA', 'CAP_DON_VI'].includes(editingAccount.role) ? editingAccount.xaName : null };
                setUsersList(prev => prev.map(u => u.username === updated.username ? updated : u));
                if (currentUser?.username === updated.username) setCurrentUser(updated);
                setEditingAccount(null);
                alert(`Đã cập nhật tài khoản "${updated.username}".`);
            };

            const handleDeleteAccount = (usernameToDelete) => {
                if (usernameToDelete === 'admin') {
                    alert('Không thể xóa tài khoản Quản trị hệ thống mặc định!');
                    return;
                }
                if (window.confirm(`Bạn có chắc chắn muốn xóa tài khoản "${usernameToDelete}"?`)) {
                    setUsersList(usersList.filter(u => u.username !== usernameToDelete));
                }
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                setPassMsg({ type: '', text: '' });
                if (passForm.oldPass !== currentUser.pass) {
                    setPassMsg({ type: 'error', text: 'Mật khẩu hiện tại không đúng!' });
                    return;
                }
                if (passForm.newPass.length < 6) {
                    setPassMsg({ type: 'error', text: 'Mật khẩu mới phải từ 6 ký tự!' });
                    return;
                }
                if (passForm.newPass !== passForm.confirmPass) {
                    setPassMsg({ type: 'error', text: 'Mật khẩu xác nhận không trùng khớp!' });
                    return;
                }

                setUsersList(prev => prev.map(u => u.username === currentUser.username ? { ...u, pass: passForm.newPass } : u));
                setCurrentUser(prev => ({ ...prev, pass: passForm.newPass }));
                setPassMsg({ type: 'success', text: 'Đổi mật khẩu thành công!' });
                setTimeout(() => {
                    setShowChangePassModal(false);
                    setPassForm({ oldPass: '', newPass: '', confirmPass: '' });
                    setPassMsg({ type: '', text: '' });
                }, 1200);
            };

            const handleGenericFileChange = (e, fieldName, targetFormSetter) => {
                const file = e.target.files[0];
                if (file) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (['doc', 'docx', 'pdf'].includes(ext)) {
                        targetFormSetter(prev => ({ ...prev, [fieldName]: file.name }));
                    } else {
                        alert('Chỉ chấp nhận đính kèm các tệp văn bản định dạng .doc, .docx hoặc .pdf!');
                        e.target.value = '';
                    }
                }
            };

            const handleSaveLichTiepBiThu = (e) => {
                e.preventDefault();
                if (!currentUser || !isUnitAccount(currentUser)) return;
                const xa = currentUser.xaName;
                setLichTiepMap(prev => ({
                    ...prev,
                    [xa]: { ...formLichTiepBiThu }
                }));
                alert(`Đã cập nhật & công khai thành công Lịch tiếp công dân định kỳ của Bí thư Đảng ủy ${xa}!`);
            };

            const listQuaHan = useMemo(() => {
                const today = new Date().toISOString().split('T')[0];
                return dsPhanAnh.filter(i => i.trangThai === 'QuaHan' || (i.trangThai === 'DangXuLy' && i.hanXuLy && i.hanXuLy < today));
            }, [dsPhanAnh]);

            const danhSachXaQuaHanDetails = useMemo(() => {
                const mapXa = {};
                const today = new Date();
                
                listQuaHan.forEach(item => {
                    if (!mapXa[item.xa]) {
                        mapXa[item.xa] = [];
                    }
                    let soNgayQuaHan = 0;
                    if (item.hanXuLy) {
                        const han = new Date(item.hanXuLy);
                        const diffTime = today - han;
                        soNgayQuaHan = Math.max(1, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
                    }
                    mapXa[item.xa].push({
                        ...item,
                        soNgayQuaHan
                    });
                });
                return mapXa;
            }, [listQuaHan]);

            const danhSachVanBanDonDocChoXa = useMemo(() => {
                if (!currentUser || !isUnitAccount(currentUser)) return [];
                const vanBans = dsVanBanDonDoc.filter(vb => vb.danhSachXa && vb.danhSachXa.includes(currentUser.xaName));
                
                return vanBans.filter(vb => {
                    if (!vb.chiTietVuViec || !vb.chiTietVuViec[currentUser.xaName]) return true;
                    const idsVuViec = vb.chiTietVuViec[currentUser.xaName].map(item => item.id);
                    const currentVuViecs = dsPhanAnh.filter(i => idsVuViec.includes(i.id));
                    const allCompleted = currentVuViecs.length > 0 && currentVuViecs.every(i => i.trangThai === 'DaGiaiQuet' || i.buocXuLy === 5 || i.tienDo === 100);
                    return !allCompleted;
                });
            }, [currentUser, dsVanBanDonDoc, dsPhanAnh]);

            const handleOpenDonDocModal = () => {
                if (Object.keys(danhSachXaQuaHanDetails).length === 0) {
                    alert('Hiện tại không có xã/phường nào có vụ việc quá thời hạn xử lý!');
                    return;
                }
                const randomNum = Math.floor(100 + Math.random() * 900);
                setFormDonDoc(prev => ({
                    ...prev,
                    soVanBan: `${randomNum}/CV-BNCTU`,
                    ngayBanHanh: new Date().toISOString().split('T')[0]
                }));

                // Tập hợp các xã đã từng nhận văn bản đôn đốc trước đó
                const sentXasSet = new Set();
                dsVanBanDonDoc.forEach(vb => {
                    if (vb.danhSachXa) {
                        vb.danhSachXa.forEach(x => sentXasSet.add(x));
                    }
                });

                // Mặc định chọn các xã quá hạn NHƯNG ưu tiên bỏ chọn các xã đã từng nhận đôn đốc trước đó (nếu có xã mới hoàn toàn), 
                // đồng thời admin có thể tùy chỉnh tích/bỏ tích trực tiếp trên modal.
                const allOverdueXas = Object.keys(danhSachXaQuaHanDetails);
                // Mặc định chọn tất cả các xã quá hạn, hoặc chỉ chọn các xã chưa từng nhận đôn đốc. Theo yêu cầu: "tránh trường hợp khi có đơn vị mới bị quá hạn mình nhấn Phát hành văn bản Đôn đốc lại tiếp tục gửi đến những nơi đã gửi văn bản đôn đốc trước đó."
                // Do đó ta mặc định chọn các xã chưa từng nhận văn bản đôn đốc (hoặc cho phép Admin tự chọn/bỏ chọn). Ở đây ta khởi tạo những xã chưa từng nhận được check sẵn, các xã đã nhận rồi thì bỏ check sẵn (nhưng vẫn hiện để admin có thể tích lại nếu muốn).
                const initialSelected = allOverdueXas.filter(xa => !sentXasSet.has(xa));
                // Nếu tất cả xã quá hạn đều đã nhận rồi thì chọn hết để tránh trống danh sách gửi
                setSelectedXaDonDoc(initialSelected.length > 0 ? initialSelected : allOverdueXas);

                setShowDonDocModal(true);
            };

            const handleSendDonDoc = (e) => {
                e.preventDefault();
                if (selectedXaDonDoc.length === 0) {
                    alert('Vui lòng chọn ít nhất một đơn vị xã/phường để phát hành văn bản đôn đốc!');
                    return;
                }

                // Lọc chi tiết vụ việc chỉ lấy các xã được chọn gửi
                const filteredChiTietVuViec = {};
                selectedXaDonDoc.forEach(xa => {
                    if (danhSachXaQuaHanDetails[xa]) {
                        filteredChiTietVuViec[xa] = danhSachXaQuaHanDetails[xa];
                    }
                });

                const newVB = {
                    id: Date.now(),
                    soVanBan: formDonDoc.soVanBan,
                    ngayBanHanh: formDonDoc.ngayBanHanh,
                    trichYeu: formDonDoc.trichYeu,
                    hanBaoCao: formDonDoc.hanBaoCao,
                    yCau: formDonDoc.yCau,
                    danhSachXa: selectedXaDonDoc,
                    chiTietVuViec: filteredChiTietVuViec,
                    nguoiPhatHanh: currentUser.name
                };

                setDsVanBanDonDoc(prev => [newVB, ...prev]);
                setShowDonDocModal(false);
                alert(`Đã phát hành thành công Công văn đôn đốc số ${formDonDoc.soVanBan} đến ${selectedXaDonDoc.length} xã/phường đã chọn!`);
            };

            const dsFiltered = dsPhanAnh.filter(item => {
                if (currentUser && isUnitAccount(currentUser)) {
                    if (item.xa !== currentUser.xaName) return false;
                } else {
                    if (selectedXaFilter !== 'ALL' && item.xa !== selectedXaFilter) return false;
                }

                if (selectedNguonDonFilter !== 'ALL') {
                    if (selectedNguonDonFilter === 'Trực tiếp TCD') {
                        if (item.nguonDon && item.nguonDon !== 'Trực tiếp TCD') return false;
                    } else if (item.nguonDon !== selectedNguonDonFilter) {
                        return false;
                    }
                }

                return item.congDan.toLowerCase().includes(searchTerm.toLowerCase()) || 
                       (item.diaChiCongDan && item.diaChiCongDan.toLowerCase().includes(searchTerm.toLowerCase())) ||
                       item.noiDung.toLowerCase().includes(searchTerm.toLowerCase()) ||
                       item.xa.toLowerCase().includes(searchTerm.toLowerCase());
            });

            // Dữ liệu riêng cho Sổ Theo dõi Tiếp công dân:
            // Chỉ hiển thị các bản ghi được nhập từ Form 1 - Nhật ký Tiếp công dân Trực tiếp.
            // Các bản ghi Form 2 (Bưu chính/DVC/Cơ quan khác...) không xuất hiện trong Sổ này.
            const dsSoTiepDan = dsPhanAnh.filter(item => {
                // Sổ này chỉ nhận dữ liệu từ Form 1 - Nhật ký Tiếp công dân Trực tiếp.
                if (item.nguonDon && item.nguonDon !== 'Trực tiếp TCD') return false;

                // Giữ nguyên bộ lọc đơn vị và tìm kiếm của Sổ.
                if (currentUser && isUnitAccount(currentUser)) {
                    if (item.xa !== currentUser.xaName) return false;
                } else if (selectedXaFilter !== 'ALL' && item.xa !== selectedXaFilter) {
                    return false;
                }

                const q = searchTerm.toLowerCase();
                return item.congDan.toLowerCase().includes(q) ||
                    (item.diaChiCongDan && item.diaChiCongDan.toLowerCase().includes(q)) ||
                    item.noiDung.toLowerCase().includes(q) ||
                    item.xa.toLowerCase().includes(q);
            });

            const exportToExcel = () => {
                let baseData = dsFiltered;
                if (isUnitAccount(currentUser)) {
                    baseData = dsPhanAnh.filter(i => i.xa === currentUser.xaName);
                }

                if (baseData.length === 0) {
                    alert('Không có dữ liệu để xuất file Excel!');
                    return;
                }

                const listTiepDan = baseData.filter(i => i.nguonDon === 'Trực tiếp TCD' || !i.nguonDon);
                const listDonThu = baseData.filter(i => i.nguonDon && i.nguonDon !== 'Trực tiếp TCD');

                const workbook = XLSX.utils.book_new();

                const columnWidths = [
                    { wch: 5 }, { wch: 25 }, { wch: 18 }, { wch: 18 }, { wch: 12 }, { wch: 20 }, 
                    { wch: 25 }, { wch: 12 }, { wch: 40 }, { wch: 25 }, { wch: 12 }, { wch: 18 }, { wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 15 }
                ];

                if (listTiepDan.length > 0) {
                    const dataTiepDanExcel = listTiepDan.map((item, index) => ({
                        "STT": index + 1,
                        "Đơn vị tiếp nhận": item.xa,
                        "Nguồn đơn": item.nguonDon || 'Trực tiếp TCD',
                        "Lãnh đạo/Bí thư tiếp": item.biThu,
                        "Ngày tiếp": item.ngayTiep,
                        "Hình thức tiếp": `${item.loaiHinhTiep || 'Định kỳ'} (${item.soNguoi || 1} người)`,
                        "Họ tên công dân": item.congDan,
                        "Địa chỉ công dân": item.diaChiCongDan || '',
                        "Loại vụ việc": item.loai,
                        "Nội dung phản ánh / Chỉ đạo": item.noiDung,
                        "Bước xử lý hiện tại": BUOC_XU_LY.find(b => b.step === item.buocXuLy)?.name || 'Chưa phân loại',
                        "Tiến độ (%)": `${item.tienDo || 0}%`,
                        "Số VB chỉ đạo/Kết luận": item.soVanBan || 'Chưa có',
                        "Đơn vị xử lý": item.donViGiaiQuet,
                        "Hạn giải quyết": item.hanXuLy,
                        "Ngày ra Kết luận": item.ngayKetLuan || 'Chưa có',
                        "Trạng thái": item.trangThai === 'DaGiaiQuet' ? 'Đã giải quyết' : (item.trangThai === 'DangXuLy' ? 'Đang xử lý' : 'Quá hạn')
                    }));

                    const wsTiepDan = XLSX.utils.json_to_sheet(dataTiepDanExcel);
                    wsTiepDan['!cols'] = columnWidths;
                    XLSX.utils.book_append_sheet(workbook, wsTiepDan, "Tiep_Cong_Dan");
                } else {
                    const wsTiepDanEmpty = XLSX.utils.json_to_sheet([{ "Thông báo": "Không có dữ liệu Tiếp công dân" }]);
                    XLSX.utils.book_append_sheet(workbook, wsTiepDanEmpty, "Tiep_Cong_Dan");
                }

                if (listDonThu.length > 0) {
                    const dataDonThuExcel = listDonThu.map((item, index) => ({
                        "STT": index + 1,
                        "Đơn vị tiếp nhận": item.xa,
                        "Nguồn gửi đơn": item.nguonDon,
                        "Cán bộ/Lãnh đạo duyệt": item.biThu,
                        "Ngày nhận đơn": item.ngayTiep,
                        "Họ tên người gửi đơn": item.congDan,
                        "Địa chỉ công dân": item.diaChiCongDan || '',
                        "Loại đơn thư": item.loai,
                        "Trích yếu nội dung đơn thư": item.noiDung,
                        "Bước xử lý hiện tại": BUOC_XU_LY.find(b => b.step === item.buocXuLy)?.name || 'Chưa phân loại',
                        "Tiến độ (%)": `${item.tienDo || 0}%`,
                        "Số VB chỉ đạo/Kết luận": item.soVanBan || 'Chưa có',
                        "Đơn vị thụ lý giải quyết": item.donViGiaiQuet,
                        "Hạn giải quyết": item.hanXuLy,
                        "Ngày ra Kết luận": item.ngayKetLuan || 'Chưa có',
                        "Trạng thái": item.trangThai === 'DaGiaiQuet' ? 'Đã giải quyết' : (item.trangThai === 'DangXuLy' ? 'Đang xử lý' : 'Quá hạn')

                                                // Kiểm tra xem xã này đã từng nhận văn bản đôn đốc nào trước đó chưa
                                                const hasSentBefore = dsVanBanDonDoc.some(vb => vb.danhSachXa && vb.danhSachXa.includes(xa));
                                                const countVuViecQuaHan = danhSachXaQuaHanDetails[xa].length;

                                                return (
                                                    <label key={xa} className={`flex items-center justify-between p-2 rounded border text-xs cursor-pointer transition ${isSelected ? 'bg-rose-50/70 border-rose-200 font-medium' : 'bg-white border-slate-100 hover:bg-slate-50'}`}>
                                                        <div className="flex items-center space-x-2">
                                                            <input 
                                                                type="checkbox"
                                                                checked={isSelected}
                                                                onChange={(e) => {
                                                                    if (e.target.checked) {
                                                                        setSelectedXaDonDoc([...selectedXaDonDoc, xa]);
                                                                    } else {
                                                                        setSelectedXaDonDoc(selectedXaDonDoc.filter(item => item !== xa));
                                                                    }
                                                                }}
                                                                className="w-4 h-4 text-rose-600 rounded"
                                                            />
                                                            <span className="font-bold text-slate-800">{xa}</span>
                                                            <span className="text-slate-500">({countVuViecQuaHan} vụ việc quá hạn)</span>
                                                        </div>
                                                        <div>
                                                            {hasSentBefore ? (
                                                                <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold" title="Đơn vị này đã từng được gửi văn bản đôn đốc trước đó">
                                                                    ⚠️ Đã từng gửi ĐĐ
                                                                </span>
                                                            ) : (
                                                                <span className="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded font-bold">
                                                                    ✨ Chưa từng gửi ĐĐ
                                                                </span>
                                                            )}
                                                        </div>
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="flex justify-end space-x-3 pt-3 border-t border-slate-200">
                                        <button type="button" onClick={() => setShowDonDocModal(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg text-xs transition">Hủy bỏ</button>
                                        <button type="submit" className="px-5 py-2 bg-rose-700 hover:bg-rose-800 text-white font-bold rounded-lg text-xs transition shadow">Phát hành Công văn Đôn đốc ({selectedXaDonDoc.length} đơn vị)</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL ĐỔI MẬT KHẨU */}
                    {showChangePassModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 border border-slate-200">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                                    <h3 className="font-extrabold text-slate-800 text-base">🔑 Đổi mật khẩu tài khoản</h3>
                                    <button onClick={() => setShowChangePassModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>

                                {passMsg.text && (
                                    <div className={`mb-4 p-3 rounded-lg text-xs font-semibold text-center ${passMsg.type === 'success' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>
                                        {passMsg.text}
                                    </div>
                                )}

                                <form onSubmit={handleChangePassword} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu hiện tại</label>
                                        <input type="password" required value={passForm.oldPass} onChange={e => setPassForm({...passForm, oldPass: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu mới (từ 6 ký tự)</label>
                                        <input type="password" required value={passForm.newPass} onChange={e => setPassForm({...passForm, newPass: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Xác nhận mật khẩu mới</label>
                                        <input type="password" required value={passForm.confirmPass} onChange={e => setPassForm({...passForm, confirmPass: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded-lg text-sm uppercase transition shadow">Xác nhận đổi</button>
                                        <button type="button" onClick={() => setShowChangePassModal(false)} className="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-sm transition">Đóng</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL CẬP NHẬT QUY TRÌNH XỬ LÝ VỤ VIỆC */}
                    {showProcessModal && selectedItemForProcess && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                                    <h3 className="font-extrabold text-slate-800 text-base">⚙️ Cập nhật Tiến độ & Kết luận Vụ việc #{selectedItemForProcess.id}</h3>
                                    <button onClick={() => setShowProcessModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>

                                <div className="mb-4 bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-1">
                                    <p><strong>Công dân:</strong> {selectedItemForProcess.congDan}</p>
                                    <p><strong>Nội dung:</strong> {selectedItemForProcess.noiDung}</p>
                                </div>

                                <form onSubmit={handleSaveProcess} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Bước xử lý hiện tại (5 Bước)</label>
                                        <select 
                                            value={processForm.buocXuLy} 
                                            onChange={e => {
                                                const val = parseInt(e.target.value);
                                                let tDo = processForm.tienDo;
                                                if (val === 1) tDo = 10;
                                                if (val === 2) tDo = 30;
                                                if (val === 3) tDo = 60;
                                                if (val === 4) tDo = 90;
                                                if (val === 5) tDo = 100;
                                                setProcessForm({...processForm, buocXuLy: val, tienDo: tDo});
                                            }}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 font-medium"
                                        >
                                            {BUOC_XU_LY.map(b => (
                                                <option key={b.step} value={b.step}>{b.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Tiến độ hoàn thành (%): {processForm.tienDo}%</label>
                                        <input 
                                            type="range" min="0" max="100" step="5"
                                            value={processForm.tienDo} 
                                            onChange={e => setProcessForm({...processForm, tienDo: parseInt(e.target.value)})}
                                            className="w-full accent-indigo-600 cursor-pointer"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Số Văn bản / Kết luận chỉ đạo</label>
                                            <input type="text" placeholder="Ví dụ: 45/KL-UBND..." value={processForm.soVanBan} onChange={e => setProcessForm({...processForm, soVanBan: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Ngày ban hành kết luận</label>
                                            <input type="date" value={processForm.ngayKetLuan} onChange={e => setProcessForm({...processForm, ngayKetLuan: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Đơn vị chịu trách nhiệm giải quyết</label>
                                        <input type="text" required value={processForm.donViGiaiQuet} onChange={e => setProcessForm({...processForm, donViGiaiQuet: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Đính kèm file Văn bản / Kết luận (.pdf, .doc)</label>
                                        <input type="file" accept=".doc,.docx,.pdf" onChange={e => handleGenericFileChange(e, 'fileSoVanBan', setProcessForm)} className="w-full text-xs p-1 border border-slate-300 rounded-lg" />
                                        {processForm.fileSoVanBan && <p className="text-[11px] text-emerald-600 mt-1">✓ File: {processForm.fileSoVanBan}</p>}
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm uppercase transition shadow">Lưu Cập Nhật</button>
                                        <button type="button" onClick={() => setShowProcessModal(false)} className="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-sm transition">Đóng</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
